<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>What are you working on?</title>
  <link rel="stylesheet" href="intent.css">
</head>
<body>
  <form id="f">
    <label for="t">What are you working on?</label>
    <input id="t" maxlength="80" autocomplete="off" spellcheck="false" placeholder="e.g. coding the settings page" autofocus>
    <div class="hint">Enter to set it, Esc to skip. This disappears by itself.</div>
  </form>
  <script src="intent.js"></script>
</body>
</html>
