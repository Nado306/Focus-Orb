<!doctype html>

<body>
  <div id="stage">
  <main id="orb" class="phase-focus idle" title="Click to start or pause. Drag to move. Right-click for options.">

        <div class="cdl-wax"><i class="cdl-drip"></i></div>

      <div class="a a-seedling">

              <stop class="cf-l2" offset=".28"></stop><stop class="cf-l2" offset=".55"></stop>

      <!-- futuristic themes (styled in themes-future.css) -->

    <svg class="orbit" viewBox="0 0 220 220" aria-hidden="true">
      <defs>
        <clipPath id="clip-up"><rect x="-20" y="-20" width="260" height="130"></rect></clipPath>
        <clipPath id="clip-down"><rect x="-20" y="110" width="260" height="130"></rect></clipPath>

          <stop offset="0" stop-color="#ffffff"></stop>
          <stop offset="0.55" stop-color="#ffe4d2"></stop>

    <div class="glass" aria-hidden="true">

        <svg class="wave" viewBox="0 0 336 20" preserveAspectRatio="none"><path d="M0 10Q21 20 42 10T84 10T126 10T168 10T210 10T252 10T294 10T336 10V20H0Z"></path></svg>
      </div>
    </div>
    <div class="planet"></div>

    <svg class="orbit" viewBox="0 0 220 220" aria-hidden="true">
      <g transform="rotate(-22 110 110)">
