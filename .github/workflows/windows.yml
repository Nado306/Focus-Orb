# Builds and checks Focus Orb on a real Windows machine, on every push.
#
# 1. installs exactly what package-lock.json says
# 2. runs the full test suite
# 3. runs the Windows-only checks: the real Windows calls the window watcher makes,
#    the watcher itself, and start with Windows through the real registry
# 4. builds the installer and the portable .exe
# 5. starts the built app, waits, and reads its log: it must still be running, its
#    window watcher must be working, and nothing may have been logged as an error
# 6. keeps both .exe files as downloads on the run's page for 30 days
# 7. on main only, when package.json has a version with no release yet: publishes the
#    installer, the portable .exe and latest.yml to this repository's Releases page
#    (creating the v<version> tag), which is where installed copies look for updates.
#    So releasing is: bump the version, push to main.

name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish a release: on main, for a version not yet released

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Is this version released yet?
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New version::$v is not released yet; it will be published if this is main and every check passes"
          fi

      - name: Tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Windows-only checks
        shell: bash
        run: node test/windows.test.js 2>&1 | tee -a test-output.txt; exit ${PIPESTATUS[0]}
        env:
          CI: 'true'

      # Logs can be hard to reach from outside GitHub; an annotation is on the run's page
      # and in the API, so a failure can always be read.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          # the last test that passed, then everything that is not a pass
          last=$(grep '^ok  -' test-output.txt | tail -n 1)
          grep -v '^ok  -' test-output.txt | tail -n 50 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
          echo "::error title=Failing test output::After: ${last}%0A$(cat tail.txt)"

      - name: Build
        run: npx electron-builder --win --publish never

      - name: Start the built app and read its log
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'dist\win-unpacked\*.exe' | Select-Object -First 1
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $env:APPDATA 'focus-orb\logs\focus-orb.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'No log file' }
          if ($app.HasExited) { throw "The app quit by itself, exit code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          if (-not (Test-Path $log)) { throw 'The app wrote no log' }
          $text = Get-Content $log -Raw
          if ($text -notmatch 'Focus Orb .* starting') { throw 'No start-up line in the log' }
          if ($text -notmatch 'Window watcher running') { throw 'The window watcher did not start' }
          if ($text -match ' error ') { throw 'Errors were logged' }

      - name: Report the app's log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'focus-orb\logs\focus-orb.log'
          if (Test-Path $log) {
            $t = (Get-Content $log -Tail 40) -join '%0A'
            Write-Output "::error title=App log (last 40 lines)::$t"
          }

      # The update path for real: the previous release installed and running, then this
      # build's installer run over it the way an update runs it. This is where "Failed to
      # uninstall old application files" showed up, after Restart to update.
      - name: Update over the previous release while it is running
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 20 --json tagName -q '.[].tagName' |
            Where-Object { $_ -ne '${{ steps.release.outputs.tag }}' } | Select-Object -First 1
          if (-not $prev) { Write-Output '::notice::No previous release to update from'; exit 0 }
          gh release download $prev --repo $env:GITHUB_REPOSITORY --pattern 'Focus-Orb-Setup-*.exe' --dir old
          $old = Get-ChildItem old\Focus-Orb-Setup-*.exe | Select-Object -First 1
          Start-Process $old.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\focus-orb\Focus Orb.exe'
          if (-not (Test-Path $exe)) { throw "The previous release ($prev) did not install" }
          $before = (Get-Item $exe).VersionInfo.ProductVersion
          Start-Process $exe
          Start-Sleep -Seconds 15
          $running = @(Get-Process -Name 'Focus Orb' -ErrorAction SilentlyContinue).Count
          $new = Get-ChildItem dist\Focus-Orb-Setup-*.exe | Select-Object -First 1
          $t = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $new.FullName -ArgumentList '/S','--updated' -PassThru
          # a failed update stops on a message box nobody can click here, so give it 2 minutes
          $hung = -not $p.WaitForExit(120000)
          if ($hung) { Stop-Process -Id $p.Id -Force; Get-Process | Where-Object { $_.Path -like '*Focus-Orb-Setup*' -or $_.Path -like '*old-uninstaller*' } | Stop-Process -Force }
          $code = if ($hung) { 'none: stopped on a message box' } else { $p.ExitCode }
          $after = if (Test-Path $exe) { (Get-Item $exe).VersionInfo.ProductVersion } else { 'nothing' }
          $msg = "From $prev ($before, $running processes running) to $($new.Name): installer exit $code after $([int]$t.Elapsed.TotalSeconds) s; installed now $after"
          Write-Output "::notice title=Update test::$msg"
          Get-Process -Name 'Focus Orb' -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($hung -or $p.ExitCode -ne 0) { throw "The update failed: $msg" }
          if ($after -eq $before) { throw "Still the old version: $msg" }

      - name: What was built
        shell: bash
        run: |
          files=$(ls -1 dist | grep -v '^win-unpacked$' | tr '\n' ' ')
          yml=$( [ -f dist/latest.yml ] && sed -e 's/%/%25/g' dist/latest.yml | awk 'BEGIN{ORS="%0A"} {print}' || echo 'none' )
          echo "::notice title=Built::${files}%0A%0Alatest.yml:%0A${yml}"

      - name: Keep the installers
        uses: actions/upload-artifact@v5
        with:
          name: focus-orb-windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.release.outputs.tag }}"
          gh release create "$v" --target "$GITHUB_SHA" \
            dist/Focus-Orb-Setup-*.exe dist/Focus-Orb-Setup-*.exe.blockmap dist/latest.yml dist/Focus-Orb-*-portable.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Focus Orb ${v#v}" \
            --notes "Installed copies update themselves. For a fresh install, download Focus-Orb-Setup-${v#v}.exe; the portable copy is Focus-Orb-${v#v}-portable.exe."
          echo "::notice title=Released::Focus Orb ${v#v} is on the releases page"
